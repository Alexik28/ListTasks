<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAEEF3;
    --surface: #FFFFFF;
    --ink: #18212C;
    --muted: #5A6776;
    --line: #D3DAE3;
    --accent: #2B50D8;
    --accent-ink: #FFFFFF;
    --danger: #B83224;
    --done: #8793A2;
    --font-display: 'Literata', Georgia, 'Times New Roman', serif;
    --font-body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161D;
      --surface: #1A212B;
      --ink: #E7ECF2;
      --muted: #94A1B0;
      --line: #2B3541;
      --accent: #86A0FF;
      --accent-ink: #0E1420;
      --danger: #FF8E7F;
      --done: #6F7B8A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161D;
    --surface: #1A212B;
    --ink: #E7ECF2;
    --muted: #94A1B0;
    --line: #2B3541;
    --accent: #86A0FF;
    --accent-ink: #0E1420;
    --danger: #FF8E7F;
    --done: #6F7B8A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 40px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  header { display: flex; flex-direction: column; gap: 6px; }
  .date { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 7vw, 44px); line-height: 1.1; text-wrap: balance; }
  .counter { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .counter strong { color: var(--ink); font-weight: 600; }

  .add { display: flex; flex-wrap: wrap; gap: 10px; }
  .add input[type="text"] {
    flex: 1 1 220px; min-width: 0;
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .add input[type="text"]::placeholder { color: var(--muted); opacity: 0.8; }
  .btn-add {
    flex: 0 0 auto; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 1.5px solid var(--accent); border-radius: 8px; padding: 12px 22px;
  }
  .btn-add:hover { filter: brightness(1.08); }
  .hint { flex-basis: 100%; margin: 0; min-height: 1.4em; font-size: 14px; color: var(--danger); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .add input[type="text"]:focus-visible { outline-offset: 0; border-color: var(--accent); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  .task { display: flex; align-items: flex-start; gap: 6px; padding: 4px 8px 4px 4px; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task label { flex: 1 1 auto; min-width: 0; display: flex; align-items: flex-start; gap: 14px; padding: 10px 6px 10px 10px; cursor: pointer; }
  .task .text { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
  .task.done .text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }

  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: 0 0 auto;
    width: 24px; height: 24px; margin: 0; border: 2px solid var(--muted); border-radius: 6px;
    background: var(--surface); display: grid; place-items: center; cursor: pointer;
  }
  .task input[type="checkbox"]::after {
    content: ""; width: 6px; height: 12px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0;
    transform: translateY(-1px) rotate(45deg) scale(0); transition: transform 0.12s ease;
  }
  .task input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .task input[type="checkbox"]:checked::after { transform: translateY(-1px) rotate(45deg) scale(1); }

  .del {
    flex: 0 0 auto; width: 40px; height: 40px; margin-top: 4px; display: grid; place-items: center;
    background: transparent; color: var(--muted); border: 0; border-radius: 8px; cursor: pointer;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .del svg { width: 18px; height: 18px; }

  .empty { margin: 0; padding: 32px 20px; text-align: center; color: var(--muted); }

  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .link {
    font: inherit; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 6px 14px;
    background: transparent; color: var(--muted); border: 1.5px solid transparent;
  }
  .chip:hover, .link:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: var(--line); background: var(--bg); font-weight: 600; }
  .link { padding-inline: 10px; }
  .link:hover { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<main class="app">
  <header>
    <p class="date" id="date"></p>
    <h1>Список задач</h1>
    <p class="counter" id="counter" aria-live="polite"></p>
  </header>

  <form class="add" id="add-form" autocomplete="off" novalidate>
    <input type="text" id="new-task" maxlength="200" placeholder="Что нужно сделать?" aria-label="Новая задача">
    <button type="submit" class="btn-add">Добавить</button>
    <p class="hint" id="hint" role="alert"></p>
  </form>

  <section class="panel" aria-label="Задачи">
    <ul class="tasks" id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <footer>
      <div class="filters" id="filters">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" class="chip" data-filter="active" aria-pressed="false">Активные</button>
        <button type="button" class="chip" data-filter="done" aria-pressed="false">Выполненные</button>
      </div>
      <button type="button" class="link" id="clear-done" hidden>Удалить выполненные</button>
    </footer>
  </section>
</main>

<script>
(function () {
  var KEY = 'todo-list-v1';
  var tasks = [];
  var filter = 'all';

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var counterEl = document.getElementById('counter');
  var inputEl = document.getElementById('new-task');
  var hintEl = document.getElementById('hint');
  var clearBtn = document.getElementById('clear-done');

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw === null) return null;
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data : null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var saved = load();
  if (saved === null) {
    tasks = [
      { id: makeId(), text: 'Купить продукты на неделю', done: false },
      { id: makeId(), text: 'Ответить на письма', done: true },
      { id: makeId(), text: 'Сделать зарядку', done: false }
    ];
    save();
  } else {
    tasks = saved.filter(function (t) { return t && typeof t.text === 'string'; });
  }

  try {
    var d = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('date').textContent = d;
  } catch (e) {}

  var trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

  function render() {
    var left = tasks.filter(function (t) { return !t.done; }).length;
    var doneCount = tasks.length - left;
    counterEl.innerHTML = tasks.length
      ? 'Осталось <strong>' + left + '</strong> из ' + tasks.length
      : 'Задач пока нет';

    var visible = tasks.filter(function (t) {
      return filter === 'all' || (filter === 'active' ? !t.done : t.done);
    });

    listEl.textContent = '';
    visible.forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');

      var label = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.addEventListener('change', function () { t.done = cb.checked; save(); render(); });
      var span = document.createElement('span');
      span.className = 'text';
      span.textContent = t.text;
      label.appendChild(cb);
      label.appendChild(span);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.setAttribute('aria-label', 'Удалить задачу: ' + t.text);
      del.innerHTML = trashSvg;
      del.addEventListener('click', function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        save(); render();
      });

      li.appendChild(label);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    if (visible.length === 0) {
      emptyEl.hidden = false;
      emptyEl.textContent = tasks.length === 0 ? 'Список пуст. Добавьте первую задачу выше.'
        : filter === 'active' ? 'Все задачи выполнены.' : 'Выполненных задач пока нет.';
    } else {
      emptyEl.hidden = true;
    }
    clearBtn.hidden = doneCount === 0;
  }

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = inputEl.value.trim();
    if (!text) {
      hintEl.textContent = 'Введите текст задачи.';
      inputEl.focus();
      return;
    }
    hintEl.textContent = '';
    tasks.push({ id: makeId(), text: text, done: false });
    inputEl.value = '';
    save(); render();
    inputEl.focus();
  });
  inputEl.addEventListener('input', function () { hintEl.textContent = ''; });

  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    filter = btn.getAttribute('data-filter');
    Array.prototype.forEach.call(this.children, function (c) {
      c.setAttribute('aria-pressed', c === btn ? 'true' : 'false');
    });
    render();
  });

  clearBtn.addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
